name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: The tag matches desktop/package.json
        run: |
          version=$(node -p 'require("./desktop/package.json").version')
          echo "tag $GITHUB_REF_NAME, desktop/package.json $version"
          test "${GITHUB_REF_NAME#v}" = "$version"

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes ""

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Desktop install
        run: pnpm --dir desktop install --frozen-lockfile --ignore-scripts

      - name: Stage
        run: pnpm --dir desktop stage

      - name: Package and publish
        run: pnpm --dir desktop run release
        env:
          GH_TOKEN: ${{ github.token }}
