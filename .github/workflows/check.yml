name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Dead code
        run: pnpm knip

      - name: Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Stories
        run: pnpm test:stories

      - name: Storybook
        run: pnpm storybook:build

      - name: App
        run: pnpm build
        env:
          WF_PROFILE_SOURCE: fixture
