mods:
  - mod: Hunter Adrenaline
    lines:
      - match: "Convert +45% of Damage on Health to Energy"
        outcome: "Damage to your health gives you energy"
        amount: "+45%"
        stat: Health damage to Energy
        example:
          { before: 0, after: 45, unit: "", line: "A hit that takes 100 health gives 45 energy." }
        note: "Shields take hits first, so it gives more on a Warframe with few or no shields."

  - mod: Acid Shells
    lines:
      - match: "Enemies explode on death"
        outcome: "Kills burst into Corrosive"
        amount: "+45%"
        stat: Enemy health as Corrosive
        example:
          {
            before: 0,
            after: 900,
            unit: "",
            line: "An enemy with 1,000 health bursts for 900 Corrosive within 15 m.",
          }
        note: "The burst adds 450 to 45% of the enemy's health. Corrosive strips armor."

  - mod: Aerial Ace
    lines:
      - match: "Refresh Double Jump up to 6x while Airborne"
        outcome: "Kills in the air give back your double jump"
        amount: "6×"
        stat: Double jump refresh
        example:
          {
            before: 1,
            after: 7,
            unit: "",
            line: "A jump that allows 1 double jump allows 7 before you land.",
          }
        note: "It counts only while you are in the air."

  - mod: Growing Power
    lines:
      - match: "Squad increases personal Ability Strength by 25%"
        outcome: "Status effects you cause make the squad's abilities stronger"
        amount: "+25%"
        stat: Ability Strength
        example:
          { before: 100, after: 125, unit: "%", line: "An ability at 100% strength reaches 125%." }
        note: "An aura counts for the whole squad. Only after you cause a status effect with a weapon, lasts 6 s."

  - mod: Affinity Spike
    lines:
      - match: "grant 45% more Melee Affinity"
        outcome: "Melee kills give more affinity"
        amount: "+45%"
        stat: Melee Affinity
        example:
          { before: 100, after: 145, unit: "", line: "A melee kill worth 100 affinity gives 145." }
        note: "Affinity is the experience that ranks up your gear."
