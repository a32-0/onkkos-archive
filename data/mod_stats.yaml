version: 1
last_verified: "2026-11-11"

families:
  - id: critical
    icon: crisis-alert
    match: "critical"
  - id: status
    icon: flare
    match: "status"
  - id: element
    icon: science
    match: "\\b(heat|cold|electricity|toxin|blast|corrosive|gas|magnetic|radiation|viral|impact|puncture|slash|void)\\b"
  - id: ability
    icon: bolt
    match: "abilit|energy|casting|augment"
  - id: survival
    icon: shield
    match: "health|shield|armor|damage reduction|resist|revive|bleedout|overguard"
  - id: speed
    icon: speed
    match: "speed|fire rate|reload|mobility|sprint|parkour|slide|velocity|jump|glide|wall latch|charge rate|holster"
  - id: damage
    icon: swords
    match: "damage|multishot|punch through|heavy attack|combo|finisher"
  - id: handling
    icon: tune
    match: "magazine|ammo|recoil|zoom|accuracy|spread|range|projectile|noise|flight"
  - id: utility
    icon: extension
    match: ""

elements:
  Heat: { Cold: Blast, Electricity: Radiation, Toxin: Gas }
  Cold: { Heat: Blast, Electricity: Magnetic, Toxin: Viral }
  Electricity: { Heat: Radiation, Cold: Magnetic, Toxin: Corrosive }
  Toxin: { Heat: Gas, Cold: Viral, Electricity: Corrosive }

stats:
  - stat: Critical Chance
    outcome: More critical hits
    down: Fewer critical hits
    example:
      {
        math: grow,
        base: 20,
        unit: "%",
        line: "A weapon with {base} critical chance gets {after}.",
      }
    note: It grows the weapon's own chance, so it does little on a weapon with a low one. Adds to other critical chance mods.

  - stat: Critical Damage
    outcome: Harder critical hits
    down: Softer critical hits
    example:
      {
        math: grow,
        base: 2,
        unit: "×",
        line: "A critical hit that does {base} the damage does {after}.",
      }
    note: It only matters when a hit is critical, so it pays on a weapon with a high critical chance.

  - stat: Damage
    outcome: Every hit does more damage
    down: Every hit does less damage
    example: { math: grow, base: 100, unit: "", line: "A shot of {base} damage does {after}." }
    note: Adds to other damage mods. Elements and faction mods multiply on top of it.

  - stat: Melee Damage
    outcome: Every swing does more damage
    down: Every swing does less damage
    example: { math: grow, base: 100, unit: "", line: "A swing of {base} damage does {after}." }
    note: Adds to other melee damage mods. Elements and faction mods multiply on top of it.

  - stat: Multishot
    outcome: More projectiles per shot
    down: Fewer projectiles per shot
    example:
      {
        math: grow,
        base: 1,
        unit: "",
        line: "A weapon that fires {base} projectile fires {after} on average.",
      }
    note: A part of a projectile is a chance at one more, and each one carries the full damage.

  - stat: Status Chance
    outcome: More status effects
    down: Fewer status effects
    example:
      { math: grow, base: 20, unit: "%", line: "A weapon with {base} status chance gets {after}." }
    note: It grows the weapon's own chance, so it does little on a weapon with a low one.

  - stat: Status Duration
    outcome: Status effects last longer
    down: Status effects end sooner
    example:
      { math: grow, base: 6, unit: "s", line: "A status effect that lasts {base} lasts {after}." }
    note: "Each status effect on an enemy lasts longer, so damage over time keeps ticking for longer."

  - stat: Fire Rate
    outcome: Shoots faster
    down: Shoots slower
    example:
      {
        math: grow,
        base: 10,
        unit: "",
        line: "A weapon that fires {base} shots a second fires {after}.",
      }
    note: A bow or a charged weapon charges faster instead.

  - stat: Attack Speed
    outcome: Faster melee attacks
    down: Slower melee attacks
    example: { math: grow, base: 1, unit: "×", line: "An attack speed of {base} becomes {after}." }
    note: Adds to other attack speed.

  - stat: Reload Speed
    outcome: Reloads faster
    down: Reloads slower
    example: { math: shrink, base: 2, unit: "s", line: "A reload of {base} takes {after}." }
    note: "It grows the speed, so the time shrinks by less than the number: +100% halves a reload."

  - stat: Magazine Capacity
    outcome: More rounds per magazine
    down: Fewer rounds per magazine
    example: { math: grow, base: 30, unit: "", line: "A magazine of {base} holds {after}." }
    note: "A magazine refills from the ammo you carry, so a bigger one does not add ammo."

  - stat: Ammo Maximum
    outcome: Carries more ammo
    down: Carries less ammo
    example:
      {
        math: grow,
        base: 540,
        unit: "",
        line: "A weapon that carries {base} rounds carries {after}.",
      }
    note: "It raises only the ammo you carry; the magazine keeps its size."

  - stat: Punch Through
    outcome: Shots go through enemies and cover
    example:
      {
        math: plus,
        base: 0,
        unit: " m",
        line: "A shot that stops at the first enemy goes through {after} of bodies and cover.",
      }
    note: The number is how many metres of body or cover a shot passes.

  - stat: Weapon Recoil
    outcome: More recoil
    down: Less recoil
    example: { math: grow, base: 100, unit: "%", line: "A kick of {base} becomes {after}." }
    note: "Recoil is how far the weapon climbs while you keep firing."

  - stat: Projectile Speed
    outcome: Faster projectiles
    down: Slower projectiles
    example:
      { math: grow, base: 100, unit: " m/s", line: "A projectile at {base} flies at {after}." }
    note: Only weapons that fire projectiles feel it; a hitscan weapon does not.

  - stat: Heat
    outcome: Adds fire damage
    example:
      {
        math: add,
        base: 100,
        unit: "",
        line: "A weapon that does {base} damage adds {added} Heat.",
      }
    note: Its status burns enemies and strips their armor. It pairs with the next element in your mod order.

  - stat: Cold
    outcome: Adds cold damage
    example:
      {
        math: add,
        base: 100,
        unit: "",
        line: "A weapon that does {base} damage adds {added} Cold.",
      }
    note: Its status slows enemies and makes critical hits on them hurt more. It pairs with the next element in your mod order.

  - stat: Electricity
    outcome: Adds electric damage
    example:
      {
        math: add,
        base: 100,
        unit: "",
        line: "A weapon that does {base} damage adds {added} Electricity.",
      }
    note: Its status stuns an enemy and arcs to the ones around it. It pairs with the next element in your mod order.

  - stat: Toxin
    outcome: Adds poison damage
    example:
      {
        math: add,
        base: 100,
        unit: "",
        line: "A weapon that does {base} damage adds {added} Toxin.",
      }
    note: Toxin goes through shields. It pairs with the next element in your mod order.

  - stat: Impact
    outcome: More impact damage
    example:
      {
        math: grow,
        base: 30,
        unit: "",
        line: "A weapon whose shots do {base} Impact does {after}.",
      }
    note: It grows only the part of the weapon's damage that is already Impact.

  - stat: Puncture
    outcome: More puncture damage
    example:
      {
        math: grow,
        base: 30,
        unit: "",
        line: "A weapon whose shots do {base} Puncture does {after}.",
      }
    note: It grows only the part of the weapon's damage that is already Puncture.

  - stat: Slash
    outcome: More slash damage
    example:
      { math: grow, base: 30, unit: "", line: "A weapon whose shots do {base} Slash does {after}." }
    note: It grows only the part of the weapon's damage that is already Slash.

  - stat: Loot Radar
    outcome: Shows loot on your minimap
    down: Shows less loot on your minimap
    example: { math: plus, base: 0, unit: " m", line: "Loot within {after} shows on your minimap." }
    note: Containers, lockers and dropped loot show up; you still pick them up yourself.

  - stat: Enemy Radar
    outcome: Shows enemies on your minimap
    down: Shows fewer enemies on your minimap
    example:
      { math: plus, base: 0, unit: " m", line: "Enemies within {after} show on your minimap." }
    note: It shows enemies through walls, only on the minimap.

  - stat: Beam Range
    outcome: Beams reach further
    down: Beams reach less far
    example:
      { math: plus, base: 20, unit: " m", line: "A beam that reaches {base} reaches {after}." }
    note: It counts only on weapons that fire a continuous beam.

  - stat: Sniper Rifle Damage
    outcome: "Sniper rifles hit harder"
    down: "Sniper rifles hit softer"
    example:
      { math: grow, base: 100, unit: "", line: "A sniper shot of {base} damage does {after}." }
    note: "It counts only on sniper rifles."

  - stat: Rifle Damage
    outcome: "Rifles hit harder"
    down: "Rifles hit softer"
    example:
      { math: grow, base: 100, unit: "", line: "A rifle shot of {base} damage does {after}." }
    note: "It counts only on rifles, not on bows or sniper rifles."

  - stat: Pistol Damage
    outcome: "Pistols hit harder"
    down: "Pistols hit softer"
    example:
      { math: grow, base: 100, unit: "", line: "A pistol shot of {base} damage does {after}." }
    note: "It counts only on secondary weapons."

  - stat: Shotgun Damage
    outcome: "Shotguns hit harder"
    down: "Shotguns hit softer"
    example:
      { math: grow, base: 100, unit: "", line: "A shotgun blast of {base} damage does {after}." }
    note: "It counts only on shotguns."

  - stat: Weapon Damage
    outcome: "Weapons hit harder"
    down: "Weapons hit softer"
    example: { math: grow, base: 100, unit: "", line: "A shot of {base} damage does {after}." }
    note: "It counts on every weapon you hold."

  - stat: Companion and Summon Damage
    outcome: "Companions and summons hit harder"
    down: "Companions and summons hit softer"
    example:
      { math: grow, base: 100, unit: "", line: "A companion's bite of {base} damage does {after}." }
    note: "It counts on companions and on what abilities summon."

  - stat: Weak Point Critical Chance
    outcome: "More critical hits on weak points"
    down: "Fewer critical hits on weak points"
    example:
      {
        math: grow,
        base: 20,
        unit: "%",
        line: "A headshot with {base} critical chance gets {after}.",
      }
    note: "It counts only on hits to a weak point, like the head."

  - stat: Energy Regen/s
    outcome: "Energy refills on its own"
    down: "Energy refills slower"
    example: { math: plus, base: 0, unit: "", line: "You gain {after} energy each second." }
    note: "It refills energy without orbs."

  - stat: Maximum Health
    outcome: "More health"
    down: "Less health"
    example: { math: grow, base: 300, unit: "", line: "A Warframe with {base} health has {after}." }
    note: "It grows the Warframe's own health."

  - stat: Pistol Ammo Recovery
    outcome: "Pistol ammo pickups give more"
    down: "Pistol ammo pickups give less"
    example:
      {
        math: grow,
        base: 100,
        unit: "%",
        line: "A pickup that gives {base} of its ammo gives {after}.",
      }
    note: "It counts on ammo pickups for secondary weapons."

  - stat: Rifle Ammo Recovery
    outcome: "Rifle ammo pickups give more"
    down: "Rifle ammo pickups give less"
    example:
      {
        math: grow,
        base: 100,
        unit: "%",
        line: "A pickup that gives {base} of its ammo gives {after}.",
      }
    note: "It counts on ammo pickups for rifles."

  - stat: Shotgun Ammo Recovery
    outcome: "Shotgun ammo pickups give more"
    down: "Shotgun ammo pickups give less"
    example:
      {
        math: grow,
        base: 100,
        unit: "%",
        line: "A pickup that gives {base} of its ammo gives {after}.",
      }
    note: "It counts on ammo pickups for shotguns."

  - stat: Sniper Rifle Ammo Recovery
    outcome: "Sniper ammo pickups give more"
    down: "Sniper ammo pickups give less"
    example:
      {
        math: grow,
        base: 100,
        unit: "%",
        line: "A pickup that gives {base} of its ammo gives {after}.",
      }
    note: "It counts on ammo pickups for sniper rifles."

  - stat: Companion Recovery Time
    outcome: "Your companion takes longer to get up"
    down: "Your companion gets up sooner"
    example:
      {
        math: plus,
        base: 60,
        unit: " s",
        line: "A companion that takes {base} to recover takes {after}.",
      }
    note: "Lower is better: the companion is back in the fight sooner."

  - stat: Full Shield Gate immunity duration
    outcome: "Full shields hold you safe for longer"
    down: "Full shields hold you safe for less"
    example:
      { math: plus, base: 0, unit: " s", line: "Breaking full shields keeps you safe for {after}." }
    note: "Shield gate is the short safety when your shields break."

  - stat: to Hacking
    outcome: "More time to hack"
    down: "Less time to hack"
    example: { math: plus, base: 10, unit: " s", line: "A hack with {base} to solve gets {after}." }
    note: "Hacking is the puzzle on consoles and locked doors."

  - stat: "'Truth'"
    outcome: "Earns the Arbiters of Hexis effect, Truth"
    example:
      {
        math: plus,
        base: 0,
        unit: "",
        line: "Every 1,000 affinity with this weapon hits enemies within 25 m for 1,000.",
      }
    note: "Truth is the Arbiters of Hexis effect. It waits 30 s between triggers."

  - stat: "'Purity'"
    outcome: "Earns the New Loka effect, Purity"
    example:
      {
        math: plus,
        base: 0,
        unit: "",
        line: "Every 1,000 affinity with this weapon hits enemies within 25 m for 1,000.",
      }
    note: "Purity is the New Loka effect. It waits 30 s between triggers."

  - stat: "'Sequence'"
    outcome: "Earns the The Perrin Sequence effect, Sequence"
    example:
      {
        math: plus,
        base: 0,
        unit: "",
        line: "Every 1,000 affinity with this weapon hits enemies within 25 m for 1,000.",
      }
    note: "Sequence is the The Perrin Sequence effect. It waits 30 s between triggers."

  - stat: "'Entropy'"
    outcome: "Earns the Cephalon Suda effect, Entropy"
    example:
      {
        math: plus,
        base: 0,
        unit: "",
        line: "Every 1,000 affinity with this weapon hits enemies within 25 m for 1,000.",
      }
    note: "Entropy is the Cephalon Suda effect. It waits 30 s between triggers."

  - stat: "'Blight'"
    outcome: "Earns the Red Veil effect, Blight"
    example:
      {
        math: plus,
        base: 0,
        unit: "",
        line: "Every 1,000 affinity with this weapon hits enemies within 25 m for 1,000.",
      }
    note: "Blight is the Red Veil effect. It waits 30 s between triggers."

  - stat: "'Justice'"
    outcome: "Earns the Steel Meridian effect, Justice"
    example:
      {
        math: plus,
        base: 0,
        unit: "",
        line: "Every 1,000 affinity with this weapon hits enemies within 25 m for 1,000.",
      }
    note: "Justice is the Steel Meridian effect. It waits 30 s between triggers."

  - stat: Damage to Murmur
    outcome: More damage to the Murmur
    example:
      {
        math: times,
        base: 100,
        unit: "",
        line: "A shot of {base} damage does {after} to the Murmur.",
      }
    note: It multiplies everything else, base damage and elements included.

  - stat: Damage to Sentients
    outcome: More damage to Sentients
    example:
      {
        math: times,
        base: 100,
        unit: "",
        line: "A hit of {base} damage does {after} to a Sentient.",
      }
    note: It multiplies everything else, base damage and elements included.

  - stat: Damage to Grineer
    outcome: More damage to the Grineer
    example:
      {
        math: times,
        base: 100,
        unit: "",
        line: "A shot of {base} damage does {after} to the Grineer.",
      }
    note: It multiplies everything else, base damage and elements included.

  - stat: Damage to Corpus
    outcome: More damage to the Corpus
    example:
      {
        math: times,
        base: 100,
        unit: "",
        line: "A shot of {base} damage does {after} to the Corpus.",
      }
    note: It multiplies everything else, base damage and elements included.

  - stat: Damage to Infested
    outcome: More damage to the Infested
    example:
      {
        math: times,
        base: 100,
        unit: "",
        line: "A shot of {base} damage does {after} to the Infested.",
      }
    note: It multiplies everything else, base damage and elements included.

  - stat: Damage to Orokin
    outcome: More damage to the Orokin
    example:
      {
        math: times,
        base: 100,
        unit: "",
        line: "A shot of {base} damage does {after} to the Orokin.",
      }
    note: It multiplies everything else, base damage and elements included.

  - stat: Health
    outcome: More health
    down: Less health
    example: { math: grow, base: 300, unit: "", line: "A Warframe with {base} health has {after}." }
    note: It grows the Warframe's own health, so it gives more to one that has more.

  - stat: Shield Capacity
    outcome: Stronger shields
    down: Weaker shields
    example:
      { math: grow, base: 300, unit: "", line: "A Warframe with {base} shields has {after}." }
    note: It grows the Warframe's own shields, so it gives more to one that has more.

  - stat: Armor
    outcome: More armor
    down: Less armor
    example: { math: grow, base: 300, unit: "", line: "A Warframe with {base} armor has {after}." }
    note: Armor lowers the health damage a Warframe takes; shields are not covered by it.

  - stat: Shield Recharge
    outcome: Shields come back faster
    down: Shields come back slower
    example:
      {
        math: grow,
        base: 100,
        unit: "",
        line: "Shields that refill {base} a second refill {after}.",
      }
    note: "It does not shorten the wait before shields start to refill; Shield Recharge Delay does."

  - stat: Ability Strength
    outcome: Stronger abilities
    down: Weaker abilities
    example:
      { math: grow, base: 100, unit: "", line: "An ability that heals {base} heals {after}." }
    note: It does not make them last longer or reach farther. Adds to other Ability Strength.

  - stat: Ability Duration
    outcome: Abilities last longer
    down: Abilities end sooner
    example:
      { math: grow, base: 10, unit: "s", line: "An ability that lasts {base} lasts {after}." }
    note: "Only abilities that last over time change; an instant one does not."

  - stat: Ability Range
    outcome: Abilities reach farther
    down: Abilities reach less far
    example:
      { math: grow, base: 10, unit: " m", line: "An ability that reaches {base} reaches {after}." }
    note: "Only abilities with a reach or an area change."

  - stat: Ability Efficiency
    outcome: Abilities cost less energy
    down: Abilities cost more energy
    example:
      { math: cost, base: 50, unit: "", line: "An ability that costs {base} energy costs {after}." }
    note: It stops at 75%, so an ability never costs less than a quarter.

  - stat: Sprint Speed
    outcome: Runs faster
    down: Runs slower
    example: { math: grow, base: 1, unit: "×", line: "A sprint speed of {base} becomes {after}." }
    note: "Adds to other sprint speed mods."

  - stat: Radiation
    outcome: Adds radiation damage
    example:
      {
        math: add,
        base: 100,
        unit: "",
        line: "A weapon that does {base} damage adds {added} Radiation.",
      }
    note: Its status turns enemies against each other.

  - stat: Magnetic
    outcome: Adds magnetic damage
    example:
      {
        math: add,
        base: 100,
        unit: "",
        line: "A weapon that does {base} damage adds {added} Magnetic.",
      }
    note: Its status drains shields and makes them take more damage.

  - stat: Corrosive
    outcome: Adds corrosive damage
    example:
      {
        math: add,
        base: 100,
        unit: "",
        line: "A weapon that does {base} damage adds {added} Corrosive.",
      }
    note: Its status strips armor.

  - stat: Viral
    outcome: Adds viral damage
    example:
      {
        math: add,
        base: 100,
        unit: "",
        line: "A weapon that does {base} damage adds {added} Viral.",
      }
    note: Its status makes enemies take more damage to their health.

  - stat: Gas
    outcome: Adds gas damage
    example:
      { math: add, base: 100, unit: "", line: "A weapon that does {base} damage adds {added} Gas." }
    note: Its status leaves a cloud that hurts the enemies around.

  - stat: Blast
    outcome: Adds blast damage
    example:
      {
        math: add,
        base: 100,
        unit: "",
        line: "A weapon that does {base} damage adds {added} Blast.",
      }
    note: Its status builds up to a blast that knocks enemies down.

  - stat: Mobility
    outcome: Moves faster
    down: Moves slower
    example: { math: grow, base: 1, unit: "×", line: "A mobility of {base} becomes {after}." }
    note: "Mobility is how quickly you turn and steer. It is a Conclave mod, so it counts only in player-versus-player matches."

  - stat: Shield Recharge Delay
    outcome: Shields wait longer to come back
    down: Shields start coming back sooner
    example:
      { math: grow, base: 3, unit: "s", line: "Shields that wait {base} to refill wait {after}." }
    note: "A lower delay means shields start to refill sooner."

  - stat: Accuracy
    outcome: More accurate shots
    down: Less accurate shots
    example: { math: grow, base: 100, unit: "", line: "An accuracy of {base} becomes {after}." }
    note: "Higher accuracy keeps shots closer to the crosshair."

  - stat: Energy Max
    outcome: More energy
    down: Less energy
    example: { math: grow, base: 150, unit: "", line: "A Warframe with {base} energy has {after}." }
    note: "It grows the Warframe's own energy, so it does more on one with a big pool."

  - stat: Status Damage
    outcome: Status effects hurt more
    down: Status effects hurt less
    example:
      {
        math: grow,
        base: 100,
        unit: "",
        line: "A status effect that does {base} damage does {after}.",
      }
    note: "It grows the damage of status effects that hurt, like Heat, Toxin, Slash and Electricity."

  - stat: Casting Speed
    outcome: Casts abilities faster
    down: Casts abilities slower
    example: { math: shrink, base: 1, unit: "s", line: "A cast of {base} takes {after}." }
    note: "Only abilities with a cast animation get faster."

  - stat: Finisher Damage
    outcome: Finishers hit harder
    down: Finishers hit softer
    example: { math: grow, base: 100, unit: "", line: "A finisher of {base} damage does {after}." }
    note: "A finisher is a melee hit on an enemy that is knocked down, opened up or unaware."

  - stat: Critical Chance when Aiming
    outcome: More critical hits while aiming
    down: Fewer critical hits while aiming
    example:
      {
        math: grow,
        base: 20,
        unit: "%",
        line: "A weapon with {base} critical chance gets {after}.",
      }
    note: Only while you aim down the sights. It grows the weapon's own chance.

  - stat: Critical Damage when Aiming
    outcome: Harder critical hits while aiming
    down: Softer critical hits while aiming
    example:
      {
        math: grow,
        base: 2,
        unit: "×",
        line: "A critical hit that does {base} the damage does {after}.",
      }
    note: Only while you aim down the sights.

  - stat: Status Chance when Aiming
    outcome: More status effects while aiming
    down: Fewer status effects while aiming
    example:
      { math: grow, base: 20, unit: "%", line: "A weapon with {base} status chance gets {after}." }
    note: Only while you aim down the sights. It grows the weapon's own chance.

  - stat: Fire Rate when Aiming
    outcome: Shoots faster while aiming
    down: Shoots slower while aiming
    example:
      {
        math: grow,
        base: 10,
        unit: "",
        line: "A weapon that fires {base} shots a second fires {after}.",
      }
    note: Only while you aim down the sights.

  - stat: Accuracy when Aiming
    outcome: More accurate while aiming
    down: Less accurate while aiming
    example: { math: grow, base: 100, unit: "", line: "An accuracy of {base} becomes {after}." }
    note: Only while you aim down the sights.

  - stat: Movement Speed when Aiming
    outcome: Moves faster while aiming
    down: Moves slower while aiming
    example:
      {
        math: grow,
        base: 100,
        unit: "%",
        line: "Moving at {base} speed while aiming becomes {after}.",
      }
    note: Only while you aim down the sights.

  - stat: Zoom
    outcome: Zooms in further
    down: Zooms in less, so you see more around the target
    example: { math: grow, base: 2, unit: "×", line: "A scope at {base} zoom reaches {after}." }
    note: "Less zoom shows more around the target."

  - stat: Weak Point Damage
