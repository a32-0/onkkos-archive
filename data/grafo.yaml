update_names:
  - version: 17
    name: "Echoes of the Sentient"
  - version: 18
    name: "The Second Dream"
  - version: 20
    name: "Octavia's Anthem"
  - version: 21
    name: "Chains of Harrow"
  - version: 33
    name: "The Duviri Paradox"
  - version: 35
    name: "Whispers in the Walls"
  - version: 40
    name: "The Vallis Undermind"

nodes:
  planet_deimos:
    label: "Deimos"
    type: hub
    requires: []
    check:
      field: "Missions[].Tag"
      equals: "DeimosHub"

  entrati_rank_2:
    label: "Rank 2+ with the Entrati (Cordon)"
    type: syndicate_rank
    requires: [planet_deimos]
    check:
      field: "Affiliations[]"
      where: "Tag == 'EntratiSyndicate'"
      condition: "Title >= 2"

  necramech_components:
    label: "Necramech components in the Foundry"
    type: resource
    item: "Voidrig"
    requires: [entrati_rank_2]
    check:
      manual: true
      question: "Do you already have the Necramech components in your Foundry?"

  hub_1999:
    label: "Höllvania (1999) access"
    type: hub
    requires: []
    check:
      field: "Missions[].Tag"
      equals: "1999Hub"

goals:
  unlock_next_planet:
    label: "Unlock the next planet"
    audience: new
    pathway: star_chart
    resolution: dynamic
    source: star_chart_order
    logic: >
      Walk star_chart_order in order. For each entry, look up junction_tag
      in the profile's Missions[].Tag. Return the first entry whose
      junction_tag does NOT appear: that's the next step.

  build_necramech:
    label: "Build a Necramech"
    place: Deimos
    audience: veteran
    pathway: collect
    requires: [planet_deimos, entrati_rank_2, necramech_components]

  unlock_1999:
    label: "Play the Hex Quest"
    quest: "The Hex"
    place: Höllvania
    audience: veteran
    pathway: star_chart
    requires: [hub_1999]
    manual_checklist_if_missing:
      - "The Duviri Paradox"
      - "The Lotus Eaters"
      - "Whispers in the Walls"
      - "The Hex"
