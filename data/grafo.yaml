version: 1

meta:
  game: "Warframe"
  source_endpoint: "https://api.warframe.com/cdn/getProfileViewingData.php?playerId={account_id}"
  limitations: >
    This endpoint does NOT expose: (1) which individual story quests were
    completed; some are confirmed by proxy through quest_evidence.yaml,
    the rest stay unreadable, (2) the Foundry inventory (blueprints in the
    build queue). Steel Path IS readable: Missions[].Tier marks nodes also
    cleared in Steel Path, counted against the community node catalog. Any
    node marked with "check.manual: true" can't be verified automatically;
    the app must ask the player directly.

star_chart_order:
  - planet: Earth
    junction_tag: null
  - planet: Venus
    junction_tag: EarthToVenusJunction
  - planet: Mercury
    junction_tag: VenusToMercuryJunction
  - planet: Mars
    junction_tag: EarthToMarsJunction
  - planet: Phobos
    junction_tag: MarsToPhobosJunction
  - planet: Ceres
    junction_tag: MarsToCeresJunction
  - planet: Jupiter
    junction_tag: CeresToJupiterJunction
  - planet: Europa
    junction_tag: JupiterToEuropaJunction
  - planet: Saturn
    junction_tag: JupiterToSaturnJunction
  - planet: Uranus
    junction_tag: SaturnToUranusJunction
  - planet: Neptune
    junction_tag: UranusToNeptuneJunction
  - planet: Pluto
    junction_tag: NeptuneToPlutoJunction
  - planet: Eris
    junction_tag: PlutoToErisJunction
  - planet: Sedna
    junction_tag: ErisToSednaJunction

off_chart_places:
  - place: Duviri
    after: Earth
    unlocked_by: "The Duviri Paradox"
  - place: Deimos
    after: Mars
    unlocked_by: "Heart of Deimos"
  - place: Void
    after: Phobos
    unlocked_by: null
  - place: Sanctuary
    after: Europa
    unlocked_by: "The New Strange"
  - place: Lua
    after: Neptune
    unlocked_by: "The Second Dream"
  - place: Kuva Fortress
    after: Sedna
    unlocked_by: "The War Within"
  - place: Zariman
    after: Sedna
    unlocked_by: "Angels of the Zariman"
  - place: Höllvania
    after: Sedna
    unlocked_by: "The Lotus Eaters"
  - place: Dark Refractory
    after: Sedna
    unlocked_by: "The Old Peace"
  - place: Earth Proxima
    after: Sedna
    unlocked_by: "Rising Tide"
  - place: Venus Proxima
    after: Sedna
    unlocked_by: "Rising Tide"
  - place: Saturn Proxima
    after: Sedna
    unlocked_by: "Rising Tide"
  - place: Uranus Proxima
    after: Sedna
    unlocked_by: "Jade Shadows: Constellations"
  - place: Neptune Proxima
    after: Sedna
    unlocked_by: "Rising Tide"
  - place: Pluto Proxima
    after: Sedna
    unlocked_by: "Rising Tide"
  - place: Veil Proxima
    after: Sedna
